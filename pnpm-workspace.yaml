packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.112.3'
  - '@aws-sdk/client-s3@3.1090.0'
  - bullmq@5.80.8
